# Argo Rollouts CRD instead of a plain Deployment -- only item-detail uses
# this; frontend and admin stay as ordinary Deployments. See docs/ci-cd.md
# and the Argo Rollouts section of README.md for why.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: item-detail
  namespace: shop
  labels:
    app: item-detail
    tier: item-detail
spec:
  replicas: 2
  selector:
    matchLabels:
      app: item-detail
      tier: item-detail
  strategy:
    canary:
      stableService: item-detail
      canaryService: item-detail-canary
      trafficRouting:
        nginx:
          stableIngress: item-detail
      steps:
        - setWeight: 20
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100
  template:
    metadata:
      labels:
        app: item-detail
        tier: item-detail
    spec:
      containers:
        - name: item-detail
          image: ghcr.io/sajin-varghese1990/shop-item-detail:f558948fd521544dd17008f62de71b3d3ae1ad1b
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_PATH
              value: /item
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: db-config
            - secretRef:
                name: db-credentials
          readinessProbe:
            httpGet:
              path: /item/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /item/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
