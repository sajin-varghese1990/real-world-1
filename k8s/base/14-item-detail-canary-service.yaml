# The Rollouts controller flips this Service's selector between the old and
# new ReplicaSet as it steps through the canary -- it's not hand-managed.
apiVersion: v1
kind: Service
metadata:
  name: item-detail-canary
  namespace: shop
  labels:
    app: item-detail
    tier: item-detail
spec:
  type: ClusterIP
  selector:
    app: item-detail
    tier: item-detail
  ports:
    - name: http
      port: 80
      targetPort: http
