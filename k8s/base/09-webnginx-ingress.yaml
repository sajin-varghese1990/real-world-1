# Separate Ingress so rewrite-target does not apply to / or /admin.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webnginx
  namespace: shop
  labels:
    app.kubernetes.io/part-of: shop
  annotations:
    nginx.ingress.kubernetes.io/service-upstream: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  ingressClassName: nginx
  rules:
    - host: shop.local
      http:
        paths:
          - path: /webnginx(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: web-svc
                port:
                  number: 80
