apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: shop
  labels:
    app: admin
    tier: admin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin
      tier: admin
  template:
    metadata:
      labels:
        app: admin
        tier: admin
    spec:
      containers:
        - name: admin
          image: ghcr.io/sajin-varghese1990/shop-admin:9cc0dfacac5f872a62c58317efe3035ba6c38070
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: BASE_PATH
              value: /admin
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: db-config
            - configMapRef:
                name: cache-config
            - secretRef:
                name: db-credentials
          readinessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /admin/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
