# Lab-only password. Apps cannot read this Secret from namespace shop;
# a copy lives in k8s/base as db-credentials.
apiVersion: v1
kind: Secret
metadata:
  name: postgres
  namespace: shop-db
  labels:
    app: postgres
    tier: data
type: Opaque
stringData:
  POSTGRES_USER: shop
  POSTGRES_DB: shop
  POSTGRES_PASSWORD: shop-lab-pass
