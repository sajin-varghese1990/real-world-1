apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: shop-db
  labels:
    app: postgres
    tier: data
data:
  01-schema.sql: |
    CREATE TABLE IF NOT EXISTS items (
      id SERIAL PRIMARY KEY,
      name TEXT NOT NULL,
      note TEXT DEFAULT '',
      created_at TIMESTAMPTZ NOT NULL DEFAULT now()
    );
