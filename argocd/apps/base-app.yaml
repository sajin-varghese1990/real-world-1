apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-base
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sajin-varghese1990/real-world-1.git
    targetRevision: main
    path: k8s/base
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  # HPA owns frontend's replica count at runtime; without this, selfHeal
  # would fight the autoscaler and revert it back to whatever's in git,
  # the same way it reverted our earlier direct kubectl apply.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: frontend
      namespace: shop
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
