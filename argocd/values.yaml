# Values for the argo/argo-cd Helm chart, rendered into argocd/install/01-argocd-chart.yaml
# (committed, not installed live) so the whole Argo CD install is reproducible from git
# alone. Kept outside argocd/install/ since that directory is applied wholesale with
# `kubectl apply -f` and this file is not a Kubernetes manifest.
# Regenerate after editing this file:
#   helm template argocd argo/argo-cd -n argocd -f argocd/values.yaml \
#     --include-crds > argocd/install/01-argocd-chart.yaml
configs:
  params:
    # Serve plain HTTP behind `kubectl port-forward`; no public ingress for this lab.
    server.insecure: true
