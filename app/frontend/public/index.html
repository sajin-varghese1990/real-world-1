<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Neighborhood Shop</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f3ec;
        --ink: #1c1917;
        --muted: #57534e;
        --card: #fffcf7;
        --accent: #0f766e;
        --line: #e7e0d4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Palatino Linotype", Palatino, Georgia, serif;
        background: var(--bg);
        color: var(--ink);
        min-height: 100vh;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        max-width: 880px;
        margin: 0 auto;
        padding: 1.5rem 1.5rem 0;
      }
      header a {
        color: var(--accent);
        text-decoration: none;
        font-size: 0.95rem;
      }
      header a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
      }
      h1 {
        font-size: 2.5rem;
        font-weight: 500;
        margin: 0;
      }
      .lede {
        color: var(--muted);
        font-size: 1.15rem;
        max-width: 36rem;
      }
      #catalog-status {
        color: var(--muted);
      }
      #catalog-status.error {
        color: #b91c1c;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }
      a.card-link {
        text-decoration: none;
        color: inherit;
        display: block;
      }
      article {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1.15rem 1.2rem 1.3rem;
      }
      article h2 {
        font-size: 1.2rem;
        margin: 0 0 0.35rem;
        font-weight: 600;
      }
      article p {
        margin: 0;
        color: var(--muted);
      }
      .empty {
        margin-top: 1.5rem;
        padding: 2rem;
        border: 1px dashed var(--line);
        border-radius: 14px;
        color: var(--muted);
        text-align: center;
      }
      #chat-toggle {
        position: fixed;
        bottom: 1.5rem;
        right: 1.5rem;
        width: 3.2rem;
        height: 3.2rem;
        border-radius: 50%;
        border: 0;
        background: var(--accent);
        color: #fff;
        font-size: 1.4rem;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
      }
      #chat-panel {
        position: fixed;
        bottom: 5.2rem;
        right: 1.5rem;
        width: 300px;
        max-height: 420px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }
      #chat-panel.hidden {
        display: none;
      }
      #chat-header {
        padding: 0.7rem 0.9rem;
        background: var(--accent);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
      }
      #chat-log {
        flex: 1;
        overflow-y: auto;
        padding: 0.7rem 0.9rem;
        font-size: 0.85rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }
      #chat-log .bubble {
        white-space: pre-wrap;
        padding: 0.45rem 0.6rem;
        border-radius: 8px;
        max-width: 90%;
      }
      #chat-log .user {
        align-self: flex-end;
        background: var(--accent);
        color: #fff;
      }
      #chat-log .bot {
        align-self: flex-start;
        background: var(--bg);
        border: 1px solid var(--line);
      }
      #chat-form {
        display: flex;
        border-top: 1px solid var(--line);
      }
      #chat-input {
        flex: 1;
        border: 0;
        padding: 0.6rem 0.7rem;
        font: inherit;
        font-size: 0.85rem;
      }
      #chat-form button {
        border: 0;
        background: var(--accent);
        color: #fff;
        padding: 0 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Neighborhood Shop</h1>
      <a href="/admin/">Staff</a>
    </header>
    <main>
      <p class="lede">
        Fresh picks from around the corner. What you see here is what we have
        in stock today.
      </p>
      <p id="catalog-status">Loading the catalog…</p>
      <div id="catalog" class="grid" hidden></div>
      <p id="empty" class="empty" hidden>
        Nothing on the shelf yet. Check back shortly.
      </p>
    </main>
    <button id="chat-toggle" title="Ask about the catalog">💬</button>
    <div id="chat-panel" class="hidden">
      <div id="chat-header">Catalog assistant</div>
      <div id="chat-log">
        <div class="bubble bot">
          Try "list all items" or "tell me about item 3".
        </div>
      </div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Ask about the catalog…" autocomplete="off" />
        <button type="submit">Send</button>
      </form>
    </div>
    <script>
      async function loadCatalog() {
        const status = document.getElementById("catalog-status");
        const grid = document.getElementById("catalog");
        const empty = document.getElementById("empty");
        try {
          const res = await fetch("/api/items");
          if (!res.ok) throw new Error("HTTP " + res.status);
          const data = await res.json();
          if (!data.items.length) {
            status.hidden = true;
            empty.hidden = false;
            return;
          }
          grid.hidden = false;
          grid.innerHTML = data.items
            .map(function (item) {
              const note = item.note ? item.note : "Available now";
              return (
                "<a class=\"card-link\" href=\"/item/" +
                item.id +
                "\"><article><h2>" +
                item.name +
                "</h2><p>" +
                note +
                "</p></article></a>"
              );
            })
            .join("");
          status.textContent =
            data.items.length === 1
              ? "1 item in stock"
              : data.items.length + " items in stock";
        } catch (err) {
          status.classList.add("error");
          status.textContent = "We could not load the catalog. Try again.";
        }
      }
      loadCatalog();

      function addBubble(text, who) {
        const log = document.getElementById("chat-log");
        const bubble = document.createElement("div");
        bubble.className = "bubble " + who;
        bubble.textContent = text;
        log.appendChild(bubble);
        log.scrollTop = log.scrollHeight;
      }

      document.getElementById("chat-toggle").addEventListener("click", function () {
        document.getElementById("chat-panel").classList.toggle("hidden");
      });

      document.getElementById("chat-form").addEventListener("submit", async function (event) {
        event.preventDefault();
        const input = document.getElementById("chat-input");
        const question = input.value.trim();
        if (!question) return;
        addBubble(question, "user");
        input.value = "";
        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question }),
          });
          const data = await res.json();
          addBubble(data.reply, "bot");
        } catch (err) {
          addBubble("Sorry, something went wrong.", "bot");
        }
      });
    </script>
  </body>
</html>
